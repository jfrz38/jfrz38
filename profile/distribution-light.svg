<svg xmlns="http://www.w3.org/2000/svg" width="790" height="330" viewBox="0 0 790 330" role="img" aria-labelledby="title desc">
  <title id="title">Open-source footprint</title>
  <desc id="desc">Package distribution metrics refreshed from public registries.</desc>
  <style>
    .title { font: 600 25px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #1f2328; }
    .value { font: 600 24px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #1f2328; }
    .label { font: 400 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #59636e; }
    .small { font: 400 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #59636e; }
    .grid { stroke: #eaeef2; stroke-width: 1; }
  </style>
  <rect x="1" y="1" width="788" height="328" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="28" y="42" class="title">Open-source footprint</text>
  <text x="28" y="98" class="value">5.5k</text>
  <text x="28" y="124" class="small">npm downloads in 2026</text>
  <line x1="278" y1="68" x2="278" y2="142" class="grid"/>
  <text x="308" y="98" class="value">24</text>
  <text x="308" y="124" class="small">crates.io downloads in 2026</text>
  <line x1="528" y1="68" x2="528" y2="142" class="grid"/>
  <text x="558" y="98" class="value">15</text>
  <text x="558" y="124" class="small">VS Code installs</text>
  <line x1="28" y1="160" x2="762" y2="160" class="grid"/>
  <circle cx="38" cy="203" r="5" fill="#0969da"/>
  <text x="55" y="210" class="value">8</text>
  <text x="55" y="236" class="small">npm packages</text>
  <circle cx="288" cy="203" r="5" fill="#0969da"/>
  <text x="305" y="210" class="value">2</text>
  <text x="305" y="236" class="small">crates.io crates</text>
  <circle cx="538" cy="203" r="5" fill="#0969da"/>
  <text x="555" y="210" class="value">1</text>
  <text x="555" y="236" class="small">Maven Central artifacts</text>
  <text x="28" y="270" class="small">Registry downloads are requests, not unique users.</text>
  <text x="28" y="301" class="small">Data through 2026-09-13</text>
</svg>
